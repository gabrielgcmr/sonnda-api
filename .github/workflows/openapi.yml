# .github/workflows/openapi.yml
name: API and OpenAPI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./cmd/openapi-export -output artifacts/openapi.json -version "$GITHUB_SHA"
      - run: jq empty artifacts/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-${{ github.sha }}
          path: artifacts/openapi.json
          if-no-files-found: error
          retention-days: 90

  notify-consumers:
    needs: verify-and-export
    runs-on: ubuntu-latest
    env:
      CI_DISPATCH_TOKEN: ${{ secrets.CI_DISPATCH_TOKEN }}
    strategy:
      matrix:
        repository: [gabrielgcmr/sonnda-web, gabrielgcmr/sonnda-mobile, gabrielgcmr/sonnda-svelte]
    steps:
      - name: Dispatch API artifact identity
        env:
          GH_TOKEN: ${{ secrets.CI_DISPATCH_TOKEN }}
          REPOSITORY: ${{ matrix.repository }}
          API_SHA: ${{ github.sha }}
          API_RUN_ID: ${{ github.run_id }}
        run: >-
          gh api --method POST repos/$REPOSITORY/dispatches
          -f event_type=api-openapi-ready
          -f client_payload[api_sha]=$API_SHA
          -f client_payload[api_run_id]=$API_RUN_ID
